<!DOCTYPE html>
<html>
<head>
  <base href="/KPR_PWA_TEST/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KPR Wildlife Monitoring System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KPR Monitor">
  <link rel="apple-touch-icon" href="icons/KPR_icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/KPR_icon.png"/>

  <title>KPR monitoring app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDKs -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth-service.js"></script>
  <script type="module" src="auth-ui.js"></script>
  <script type="module" src="auth-controller.js"></script>
</head>

<body>
  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" id="flutter-bootstrap-script"></script>

  <!-- Service Worker registration & offline caching -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/KPR_PWA_TEST/flutter_service_worker.js', {
        scope: '/KPR_PWA_TEST/'
      }).then((reg) => {
        console.log('Service worker registered');

        // Wait until the SW is active, then request full offline download
        function waitForActivation() {
          if (reg.active) {
            console.log('Service worker active, requesting downloadOffline');
            reg.active.postMessage('downloadOffline');
          } else {
            setTimeout(waitForActivation, 500);
          }
        }

        waitForActivation();
      }).catch((err) => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
